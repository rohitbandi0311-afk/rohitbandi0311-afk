<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Rohith Bandi — 3D Developer Universe</title>
<desc id="desc">An obsidian-black futuristic developer banner with dimensional chrome forms, vibrant orange and cyan lighting, and a glowing 3D cube.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".55" stop-color="#101010"/><stop offset="1" stop-color="#050505"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".18" stop-color="#777"/><stop offset=".36" stop-color="#f4f4f4"/><stop offset=".58" stop-color="#555"/><stop offset=".78" stop-color="#ddd"/><stop offset="1" stop-color="#555"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb15c"/><stop offset=".45" stop-color="#ff6b00"/><stop offset="1" stop-color="#a83200"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5fbff"/><stop offset=".45" stop-color="#00e5ff"/><stop offset="1" stop-color="#007f99"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6ffc6"/><stop offset=".5" stop-color="#39ff88"/><stop offset="1" stop-color="#087d43"/></linearGradient>
  <radialGradient id="glowO"><stop stop-color="#ff6b00" stop-opacity=".38"/><stop offset="1" stop-color="#ff6b00" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC"><stop stop-color="#00e5ff" stop-opacity=".28"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/></pattern>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1600" height="620" rx="30" fill="url(#base)"/>
<rect width="1600" height="620" rx="30" fill="url(#grid)"/>
<circle cx="1290" cy="300" r="390" fill="url(#glowC)"/>
<circle cx="150" cy="550" r="300" fill="url(#glowO)"/>
<path d="M0 520C280 420 430 650 760 520S1270 420 1600 500" fill="none" stroke="#00e5ff" stroke-opacity=".22" stroke-width="2"/>
<path d="M0 548C300 448 500 665 820 550S1300 470 1600 530" fill="none" stroke="#ff6b00" stroke-opacity=".28" stroke-width="2"/>
<!-- dimensional chrome orbit -->
<g transform="translate(1195 292)" fill="none" stroke="url(#chrome)" stroke-width="3" opacity=".75"><g>
 <animateTransform attributeName="transform" type="rotate" values="0;360" dur="48s" repeatCount="indefinite"/>
 <ellipse rx="270" ry="105" transform="rotate(-28)"/>
 <ellipse rx="270" ry="105" transform="rotate(48)" stroke="#00e5ff" stroke-opacity=".7"/>
 <ellipse rx="220" ry="82" transform="rotate(90)" stroke="#ff6b00" stroke-opacity=".7"/>
</g></g>
<!-- floating 3D cube -->
<g transform="translate(1180 165)"><g>
 <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5s" repeatCount="indefinite"/>
 <ellipse cx="35" cy="300" rx="170" ry="35" fill="#00e5ff" opacity=".16" filter="url(#shadow)"/>
 <path d="M35 0L190 88L35 177L-120 88Z" fill="url(#chrome)" stroke="#fff" stroke-opacity=".75" stroke-width="2"/>
 <path d="M-120 88L35 177V355L-120 266Z" fill="#202020" stroke="#00e5ff" stroke-width="3"/>
 <path d="M35 177L190 88V266L35 355Z" fill="#101010" stroke="#ff6b00" stroke-width="3"/>
 <path d="M35 0L190 88L35 177L-120 88Z" fill="url(#chrome)" opacity=".18"/>
 <path d="M35 177V355" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
 <path d="M-90 105L35 178L160 105" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
 <path d="M-80 238L35 305L150 238" fill="none" stroke="#00e5ff" stroke-opacity=".8" stroke-width="3"/>
 <circle cx="35" cy="177" r="12" fill="url(#cyan)"/>
</g></g>
<!-- small floating dimensional objects -->
<g transform="translate(1000 100)"><animateTransform attributeName="transform" type="translate" values="1000 100;1000 88;1000 100" dur="3.8s" repeatCount="indefinite"/>
 <path d="M0 30L42 6L84 30L42 54Z" fill="url(#orange)"/><path d="M0 30L42 54V102L0 78Z" fill="#9b3900"/><path d="M42 54L84 30V78L42 102Z" fill="#ff6b00"/>
</g>
<g transform="translate(1460 420)"><animateTransform attributeName="transform" type="translate" values="1460 420;1460 432;1460 420" dur="4.4s" repeatCount="indefinite"/>
 <path d="M0 24L34 4L68 24L34 44Z" fill="url(#cyan)"/><path d="M0 24L34 44V84L0 64Z" fill="#006b80"/><path d="M34 44L68 24V64L34 84Z" fill="#00a9c2"/>
</g>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="92" y="104" font-size="22" font-weight="700" letter-spacing="6" fill="#ff8a32">ROHITH BANDI  /  DIGITAL BUILDER</text>
 <text x="86" y="232" font-size="94" font-weight="900" letter-spacing="-4" fill="#f7f7f7">Ideas into</text>
 <text x="86" y="338" font-size="94" font-weight="900" letter-spacing="-4" fill="url(#chrome)">REAL THINGS.</text>
 <rect x="94" y="378" width="460" height="5" rx="3" fill="url(#orange)"/>
 <text x="94" y="438" font-size="29" font-weight="600" fill="#f1f1f1">CSE (Data Science)  ·  AI / ML  ·  Full-Stack</text>
 <text x="94" y="488" font-size="22" fill="#bdbdbd">Building practical technology with curiosity and purpose.</text>
 <g font-size="17" font-weight="700" letter-spacing="3">
  <text x="94" y="558" fill="#00e5ff">LEARN</text><text x="200" y="558" fill="#777">/</text>
  <text x="226" y="558" fill="#ff8a32">BUILD</text><text x="337" y="558" fill="#777">/</text>
  <text x="363" y="558" fill="#39ff88">SHIP</text><text x="465" y="558" fill="#777">/</text>
  <text x="491" y="558" fill="#e8e8e8">GROW</text>
 </g>
</g>
<g fill="#fff">
 <circle cx="920" cy="160" r="4" opacity=".7"/><circle cx="1530" cy="170" r="3" opacity=".5"/>
 <circle cx="890" cy="450" r="3" opacity=".55"/><circle cx="1400" cy="555" r="4" opacity=".6"/>
 <circle cx="1050" cy="530" r="2" opacity=".6"/><circle cx="1520" cy="330" r="3" opacity=".7"/>
</g>
</svg>