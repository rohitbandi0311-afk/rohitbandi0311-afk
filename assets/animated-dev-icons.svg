<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="t d">
<title id="t">Animated developer icons</title>
<desc id="d">Floating cyan, orange, emerald and chrome developer symbols: code, AI chip, leaf, database and rocket.</desc>
<defs>
 <linearGradient id="c" x2="1" y2="1"><stop stop-color="#a8fbff"/><stop offset=".5" stop-color="#00dfff"/><stop offset="1" stop-color="#007c9a"/></linearGradient>
 <linearGradient id="o" x2="1" y2="1"><stop stop-color="#ffd08a"/><stop offset=".5" stop-color="#ff7a18"/><stop offset="1" stop-color="#b83d00"/></linearGradient>
 <linearGradient id="g" x2="1" y2="1"><stop stop-color="#b8ffd0"/><stop offset=".5" stop-color="#39e889"/><stop offset="1" stop-color="#087b46"/></linearGradient>
 <linearGradient id="s" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#9aa3ad"/><stop offset=".7" stop-color="#f7f7f7"/><stop offset="1" stop-color="#656d78"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<g opacity=".24" fill="none" stroke="#00dfff"><path d="M80 75H920" stroke-dasharray="5 12"/><circle cx="120" cy="75" r="48"/><circle cx="330" cy="75" r="48"/><circle cx="540" cy="75" r="48"/><circle cx="750" cy="75" r="48"/><circle cx="900" cy="75" r="48"/></g>
<!-- code -->
<g transform="translate(120 74)">
 <circle r="38" fill="#00dfff" opacity=".15" filter="url(#glow)"/>
 <g>
  <path d="M-13 -19L-31 0L-13 19M13 -19L31 0L13 19M5 -25L-5 25" fill="none" stroke="url(#c)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <animateTransform attributeName="transform" type="translate" values="0 -5;0 5;0 -5" dur="3.2s" repeatCount="indefinite"/>
 </g>
</g>
<!-- AI chip -->
<g transform="translate(330 75)">
 <g>
  <rect x="-25" y="-25" width="50" height="50" rx="10" fill="#15191d" stroke="url(#s)" stroke-width="4"/>
  <rect x="-16" y="-16" width="32" height="32" rx="5" fill="none" stroke="url(#c)" stroke-width="3"/>
  <text x="0" y="7" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#00e5ff">AI</text>
  <g stroke="url(#o)" stroke-width="4" stroke-linecap="round"><path d="M-37 -15H-25M-37 0H-25M-37 15H-25M25 -15H37M25 0H37M25 15H37M-15 -37V-25M0 -37V-25M15 -37V-25M-15 25V37M0 25V37M15 25V37"/></g>
  <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="4s" repeatCount="indefinite"/>
 </g>
</g>
<!-- leaf -->
<g transform="translate(540 76)">
 <g>
  <path d="M-28 18C-33 -20 5 -42 35 -37C37 -5 15 30 -28 18Z" fill="url(#g)" stroke="#d7ffe5" stroke-width="2"/>
  <path d="M-28 20Q0 -5 25 -29M-5 2L-9 -16M8 -10L25 -12" fill="none" stroke="#075d39" stroke-width="3" stroke-linecap="round"/>
  <animateTransform attributeName="transform" type="rotate" values="-7;7;-7" dur="3.6s" repeatCount="indefinite"/>
 </g>
</g>
<!-- database -->
<g transform="translate(750 75)">
 <g>
  <ellipse cy="-22" rx="29" ry="11" fill="url(#s)" stroke="#fff" stroke-width="2"/>
  <path d="M-29 -22V22C-29 36 29 36 29 22V-22" fill="#242a30" stroke="url(#c)" stroke-width="4"/>
  <path d="M-29 -2C-29 12 29 12 29 -2M-29 13C-29 27 29 27 29 13" fill="none" stroke="url(#o)" stroke-width="4"/>
  <animateTransform attributeName="transform" type="translate" values="0 -4;0 4;0 -4" dur="2.9s" repeatCount="indefinite"/>
 </g>
</g>
<!-- rocket -->
<g transform="translate(900 75)">
 <g>
  <path d="M0 -38C24 -25 31 -2 18 20L0 34L-18 20C-31 -2 -24 -25 0 -38Z" fill="url(#s)" stroke="#fff" stroke-width="2"/>
  <circle cy="-8" r="8" fill="#00dfff" stroke="#fff" stroke-width="2"/>
  <path d="M-17 10L-34 25L-31 -1ZM17 10L34 25L31 -1Z" fill="url(#o)"/>
  <path d="M-9 32L0 49L9 32" fill="none" stroke="url(#o)" stroke-width="6" stroke-linecap="round"/>
  <animateTransform attributeName="transform" type="translate" values="0 4;0 -5;0 4" dur="2.6s" repeatCount="indefinite"/>
 </g>
</g>
</svg>